// Identity module wire contract (slice 002).
syntax = "proto3";

package gameserver.identity.v1;

import "gameserver/core/v1/core.proto";

option csharp_namespace = "GameServer.Modules.Identity.Protocol.V1";

// Section.payload of aggregate `profile`.
message ProfileState {
  string display_name = 1;
  int64 session_epoch = 2;
}

// POST /api/v1/identity/login/guest  (Public, gated)
message GuestLoginRequest {
  string local_id = 1;   // 1-64 chars [A-Za-z0-9_-]
  bytes secret = 2;      // >= 32 bytes, generated and kept on device
}

message LoginResponse {
  string session_token = 1;   // send as Authorization: Bearer <token>
  string player_id = 2;
  repeated gameserver.core.v1.Section sections = 3;
  string config_version = 4;
  int64 server_time_utc_ms = 5;
  int64 session_expires_at_utc_ms = 6;
}

// Proof of a provider identity (IDN-03). The server verifies it with the provider; ids sent here are never trusted.
message ProviderCredential {
  oneof credential {
    PlayGamesCredential play_games = 1;
    GameCenterCredential game_center = 2;
    CustomCredential custom = 15;
  }
}

// Google Play Games Services v2: PlayGamesPlatform.RequestServerSideAccess. Single use: request a new code per call.
message PlayGamesCredential {
  string server_auth_code = 1;
}

// Apple Game Center: GKLocalPlayer.fetchItems(forIdentityVerificationSignature:).
message GameCenterCredential {
  string public_key_url = 1;
  bytes signature = 2;
  bytes salt = 3;
  uint64 timestamp = 4;        // milliseconds since the Unix epoch, as returned by GameKit
  string team_player_id = 5;
  string game_player_id = 6;
  string bundle_id = 7;
}

// Provider added by the game through IIdentityProviderAdapter.
message CustomCredential {
  string provider = 1;
  bytes data = 2;
}

// POST /api/v1/identity/login/provider  (Public, gated; IDN-11)
// Send Authorization: Bearer <current token> when the device has a session: if the identity belongs to another player
// (or to no player yet) the server answers 409 SWITCH_ACCOUNT (details provider, account = existing|new) unless
// switch_account is true. Errors: IDENTITY_PROOF_INVALID (401), PROVIDER_UNAVAILABLE (503), ACCOUNT_SUSPENDED/DELETED.
message ProviderLoginRequest {
  ProviderCredential credential = 1;
  bool switch_account = 2;
}

// POST /api/v1/identity/link  (Player command identity.link, IDN-05)
// 409 IDENTITY_CONFLICT (details provider) when another player has the identity; business code PROVIDER_ALREADY_LINKED.
message LinkIdentityRequest {
  ProviderCredential credential = 1;
}

message LinkIdentityResult {
  string provider = 1;
  bool already_linked = 2;
}

// POST /api/v1/identity/display-name  (Player command identity.set_display_name, PRF-01)
// Business codes: DISPLAY_NAME_INVALID (format), DISPLAY_NAME_REJECTED (game policy).
message SetDisplayNameRequest {
  string display_name = 1;   // 2-20 letters/digits, single spaces, '_', '-', '.'
}

message SetDisplayNameResult {
  string display_name = 1;
}

// POST /api/v1/identity/delete-account  (Player command identity.request_deletion, PRIV-01)
// Locks the account at once (every session ends) and erases it after the grace period unless support cancels.
// 401 ACCOUNT_DELETED (details purgeAfter) when already requested: also the answer to a retry after a lost response,
// so it means the deletion is committed. Command-group bans do not block it; a login ban (ACCOUNT_SUSPENDED) does.
message RequestAccountDeletionRequest {}

message RequestAccountDeletionResult {
  int64 requested_at_utc_ms = 1;
  int64 purge_after_utc_ms = 2;
}

// POST /api/v1/identity/logout  (Player)
message LogoutRequest {}

message LogoutResponse {
  int64 server_time_utc_ms = 1;
}
